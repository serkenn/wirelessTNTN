// Standalone project on purpose: this is a device-side development workaround, not part of the
// app. It is deliberately absent from the root settings.gradle so CI never builds it.
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositories {
        google()
        mavenCentral()
        // Serves de.robv.android.xposed:api, which is compileOnly: the real implementation is
        // provided by LSPosed at runtime.
        maven {
            url 'https://api.xposed.info/'
            content { includeGroup 'de.robv.android.xposed' }
        }
    }
}
rootProject.name = "AramBypass"
include ':module'
