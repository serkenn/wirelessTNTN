plugins {
    id 'com.android.application'
}

android {
    namespace 'app.aoki.yuki.arambypass'
    compileSdk 35

    defaultConfig {
        applicationId "app.aoki.yuki.arambypass"
        minSdk 28
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // compileOnly: LSPosed injects the real XposedBridge into the target process at runtime.
    // Bundling it would shadow the live implementation and the hooks would silently do nothing.
    compileOnly 'de.robv.android.xposed:api:82'
}
